<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020917"/>
      <stop offset="55%" stop-color="#071222"/>
      <stop offset="100%" stop-color="#0B1A30"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E87A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00E87A" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="dotFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- subtle dot grid texture -->
  <g opacity="0.12">
    <path d="M0 0 H1200 M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200"
          stroke="#3FA9F5" stroke-width="0.5"/>
  </g>
  <circle cx="980" cy="70" r="160" fill="url(#dotFade)"/>

  <!-- Ensemble node diagram, right side -->
  <g transform="translate(870,150)" filter="url(#softGlow)">
    <!-- connecting lines from 5 model nodes into the ensemble hub -->
    <g stroke-width="1.5" fill="none" opacity="0.85">
      <path d="M -180 -85 Q -80 -85 0 0" stroke="#00C8FF"/>
      <path d="M -180 -35 Q -80 -35 0 0" stroke="#00C8FF"/>
      <path d="M -180 15  Q -80 15  0 0" stroke="#00E87A"/>
      <path d="M -180 65  Q -80 65  0 0" stroke="#F59E0B"/>
      <path d="M -180 105 Q -80 105 0 0" stroke="#F59E0B"/>
    </g>
    <!-- 5 model nodes -->
    <circle cx="-180" cy="-85" r="5" fill="#00C8FF"/>
    <circle cx="-180" cy="-35" r="5" fill="#00C8FF"/>
    <circle cx="-180" cy="15"  r="5" fill="#00E87A"/>
    <circle cx="-180" cy="65"  r="5" fill="#F59E0B"/>
    <circle cx="-180" cy="105" r="5" fill="#F59E0B"/>
    <!-- ensemble hub -->
    <circle cx="0" cy="0" r="11" fill="#020917" stroke="#00E87A" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="4" fill="#00E87A"/>
    <!-- output arc, risk-gauge motif -->
    <path d="M 40 0 A 90 90 0 0 1 -25 86" stroke="#00C8FF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Title block, left side -->
  <g transform="translate(80,108)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="58"
          letter-spacing="1" fill="#F0F6FF">DIABET<tspan fill="#00C8FF">AI</tspan></text>
    <rect x="2" y="20" width="230" height="4" fill="url(#cyanGlow)"/>
    <text x="0" y="60" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="19"
          letter-spacing="0.3" fill="#B7C6E0">Diabetes Risk Prediction &amp; Agentic AI Assistant</text>
    <text x="0" y="92" font-family="'Courier New', monospace" font-size="12.5" letter-spacing="1"
          fill="#5FE3B3" opacity="0.9">5-MODEL ENSEMBLE · SHAP · RAG CHAT · FAIRNESS AUDITS</text>
  </g>

  <rect x="0" y="0" width="1200" height="300" fill="none" stroke="#1B2C4A" stroke-width="1"/>
</svg>
